{% extends "base.html" %}
{% block title %}लॉगिन{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-gray-900 p-8 rounded-2xl border border-gray-800 shadow-2xl">
    <h2 class="text-3xl font-bold text-amber-400 mb-2 text-center">लॉगिन करें</h2>
    <p class="text-gray-400 text-center mb-6">अपने डिज़ाइन स्टूडियो में प्रवेश करें</p>
    <form method="POST" class="space-y-4">
        <input type="text" name="username" required placeholder="यूज़रनेम"
            class="input">
        <input type="password" name="password" required placeholder="पासवर्ड"
            class="input">
        <button class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-3 rounded-xl">
            लॉगिन
        </button>
    </form>
    <p class="text-center text-gray-400 mt-4">
        नया खाता? <a href="{{ url_for('register') }}" class="text-amber-400 underline">रजिस्टर करें</a>
    </p>
</div>
{% endblock %}
